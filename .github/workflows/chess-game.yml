name: "♟️ Community Chess Tournaments"

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  process-move:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.issue.title, 'Chess Move') || 
      contains(github.event.issue.labels.*.name, 'chess-move')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Debug issue info
        run: |
          echo "Issue Title: ${{ github.event.issue.title }}"
          echo "Issue Body: ${{ github.event.issue.body }}"
          echo "Issue Labels: ${{ github.event.issue.labels }}"
      
      - name: Process chess move
        run: |
          python scripts/update_board.py "${{ github.event.issue.title }}" "${{ github.event.issue.body }}"
        continue-on-error: false
      
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "♟️ Update chess board: ${{ github.event.issue.title }}"
          file_pattern: "README.md board_state.json"
      
      - name: Close issue with comment
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: |
            ✅ **Move processed!** 
            
            The board has been updated. 
            
            ♟️ Next turn: Check the README to see the new board position!
            
            Thanks for playing! 🎯